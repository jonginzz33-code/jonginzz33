name: 스토어용 실제 화면 캡처

on:
  workflow_dispatch:
  push:
    paths:
      - "ad-blocker-app/app/src/**"
      - ".github/workflows/store-screenshots.yml"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Robolectric 로 실제 화면 렌더링
        working-directory: ad-blocker-app
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/store-assets/raw
        run: gradle testDebugUnitTest --tests '*StoreScreenshotTest*' --no-daemon
      - name: 결과를 저장소에 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add store-assets/raw
          git diff --cached --quiet || (git commit -m "Update rendered store screenshots" && git push)
