name: 가상폰에서 광고 삭제 확인

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/e2e-emulator.yml"

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: 디버그 APK 빌드
        working-directory: ad-blocker-app
        run: gradle assembleDebug --no-daemon
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 가상폰에서 테스트
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/e2e.sh
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add store-assets/e2e || true
          git diff --cached --quiet || (git commit -m "E2E emulator results" && git pull --rebase && git push)
